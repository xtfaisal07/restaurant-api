openapi: 3.0.3

info:
  title: Restaurant API
  version: 1.0.0
  description: Restaurant OpenAPI contract for Flask + SQLite backend

servers:
  - url: http://127.0.0.1:5000

tags:
  - name: Menu
  - name: Customers
  - name: Tables
  - name: Reservations
  - name: Orders

paths:

  /menu:
    get:
      tags: [Menu]
      summary: List available menu items
      operationId: listMenu
      responses:
        "200":
          description: Menu grouped by category
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: "#/components/schemas/MenuItem"

  /menu/{id}:
    get:
      tags: [Menu]
      summary: Get menu item
      operationId: getMenuItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Menu item found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "404":
          description: Menu item not found

  /customers:
    post:
      tags: [Customers]
      summary: Create customer
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "409":
          description: Duplicate email

  /customers/{id}/orders:
    get:
      tags: [Customers]
      summary: Customer order history
      operationId: listCustomerOrders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerOrdersResponse"
        "404":
          description: Customer not found

  /tables:
    get:
      tags: [Tables]
      summary: List active dining tables
      operationId: listDiningTables
      responses:
        "200":
          description: Active tables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiningTable"

  /reservations:
    post:
      tags: [Reservations]
      summary: Create reservation
      operationId: createReservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
      responses:
        "201":
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: Invalid reservation
        "409":
          description: Table already reserved

  /reservations/{id}:
    get:
      tags: [Reservations]
      summary: Get reservation
      operationId: getReservation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reservation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          description: Reservation not found

  /orders:
    post:
      tags: [Orders]
      summary: Create order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "400":
          description: Invalid order

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Complete order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found

  /orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Update order status
      operationId: updateOrderStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "409":
          description: Invalid status transition
        "404":
          description: Order not found

components:
  schemas:

    Customer:
      type: object
      required:
        - id
        - name
        - email
        - phone
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string

    DiningTable:
      type: object
      required:
        - id
        - label
        - seats
      properties:
        id:
          type: integer
        label:
          type: string
        seats:
          type: integer

    MenuItem:
      type: object
      required:
        - id
        - category
        - name
        - description
        - price_cents
        - available
      properties:
        id:
          type: integer
        category:
          type: string
        name:
          type: string
        description:
          type: string
        price_cents:
          type: integer
        available:
          type: boolean

    Reservation:
      type: object
      properties:
        id:
          type: integer
        reservation_time:
          type: string
          format: date-time
        party_size:
          type: integer
        status:
          type: string
        customer:
          $ref: "#/components/schemas/Customer"
        table:
          $ref: "#/components/schemas/DiningTable"

    OrderItem:
      type: object
      properties:
        menu_item_id:
          type: integer
        name:
          type: string
        quantity:
          type: integer
        unit_price_cents:
          type: integer
        line_total_cents:
          type: integer

    Order:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
        total_cents:
          type: integer
        created_at:
          type: string
        customer:
          $ref: "#/components/schemas/Customer"
        table:
          $ref: "#/components/schemas/DiningTable"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"

    CreateCustomerRequest:
      type: object
      required:
        - name
        - email
        - phone
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string

    CreateReservationRequest:
      type: object
      required:
        - customer_id
        - dining_table_id
        - reservation_time
        - party_size
      properties:
        customer_id:
          type: integer
        dining_table_id:
          type: integer
        reservation_time:
          type: string
          format: date-time
        party_size:
          type: integer

    CreateOrderItem:
      type: object
      required:
        - menu_item_id
        - quantity
      properties:
        menu_item_id:
          type: integer
        quantity:
          type: integer

    CreateOrderRequest:
      type: object
      required:
        - customer_id
        - dining_table_id
        - items
      properties:
        customer_id:
          type: integer
        dining_table_id:
          type: integer
        reservation_id:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreateOrderItem"

    CreateOrderResponse:
      type: object
      properties:
        order_id:
          type: integer
        status:
          type: string
        total_cents:
          type: integer

    UpdateStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - NEW
            - PREPARING
            - READY
            - COMPLETED
            - CANCELLED

    StatusResponse:
      type: object
      properties:
        order_id:
          type: integer
        old_status:
          type: string
        new_status:
          type: string

    CustomerOrdersResponse:
      type: object
      properties:
        customer:
          $ref: "#/components/schemas/Customer"
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"